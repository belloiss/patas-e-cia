<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor | Patas &amp; Cia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo"><div class="topo__conteudo"><a class="topo__marca" href="index.html">Patas &amp; Cia</a><span class="topo__legenda">Cadastro de tutores e animais</span></div></header>
  <main>
    <a class="voltar" href="index.html">Voltar para tutores</a>
    <h1 id="titulo">Novo tutor</h1>
    <div id="aviso" class="aviso" role="alert" hidden></div>
    <form id="formulario" class="formulario" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" autocomplete="off">
        <p class="campo__erro" data-erro="nome"></p>
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" inputmode="tel" placeholder="(85) 98888-7777">
        <p class="campo__erro" data-erro="telefone"></p>
      </div>
      <div class="campo">
        <label for="email">E-mail (opcional)</label>
        <input id="email" name="email" type="email">
        <p class="campo__erro" data-erro="email"></p>
      </div>
      <div class="formulario__acoes">
        <button class="botao" type="submit">Salvar tutor</button>
        <a class="botao botao--secundario" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script src="js/tutor-form.js"></script>
</body>
</html>
